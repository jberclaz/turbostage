name: MacOS Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:

    runs-on: macos-latest

    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pillow

      - name: Convert icon to ICNS and background to PNG
        run: |
          mkdir -p icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size turbostage/content/icon.png \
              --out icon.iconset/icon_${size}x${size}.png
            sips -z $((size*2)) $((size*2)) turbostage/content/icon.png \
              --out icon.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns icon.iconset -o icon.icns
          sips -s format png turbostage/content/splash.jpg --out splash.png

      - name: Write IGDB credentials
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: python scripts/write_igdb_credentials.py

      - name: Run package build
        run: |
          poetry-dynamic-versioning
          # Build the .app as onedir: --onefile + --windowed is deprecated
          # in PyInstaller 6 and unpacks the whole app to a temp dir on every
          # launch.
          pyinstaller --windowed --icon=icon.icns \
            --osx-bundle-identifier com.jberclaz.turbostage \
            --add-data "turbostage/content:turbostage/content" \
            --add-data "turbostage/conf:turbostage/conf" \
            -n turbostage turbostage/main.py

      - name: Create DMG
        run: |
          brew install create-dmg
          rm -f "dist/TurboStage.dmg"
          create-dmg --volname "TurboStage" \
                     --background "splash.png" \
                     --app-drop-link 300 200 \
                     "dist/TurboStage.dmg" "dist/turbostage.app"

      - name: Upload Build Artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: turbostage-macos-${{ github.ref_name }}
          path: dist/TurboStage.dmg

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda
        with:
          files: dist/TurboStage.dmg
