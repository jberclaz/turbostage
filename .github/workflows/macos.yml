name: MacOS Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    # One native app per CPU. A single universal2 app would need every
    # binary, the Python interpreter included, to be universal2.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            dmg: TurboStage-AppleSilicon.dmg
          - runner: macos-15-intel
            arch: x86_64
            dmg: TurboStage-Intel.dmg

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pillow

      - name: Convert icon to ICNS and background to PNG
        run: |
          mkdir -p icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size turbostage/content/icon.png \
              --out icon.iconset/icon_${size}x${size}.png
            sips -z $((size*2)) $((size*2)) turbostage/content/icon.png \
              --out icon.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns icon.iconset -o icon.icns
          sips -s format png turbostage/content/splash.jpg --out splash.png

      - name: Run package build
        run: |
          poetry-dynamic-versioning
          # Build the .app as onedir: --onefile + --windowed is deprecated
          # in PyInstaller 6 and unpacks the whole app to a temp dir on every
          # launch.
          pyinstaller --windowed --icon=icon.icns \
            --target-arch ${{ matrix.arch }} \
            --osx-bundle-identifier com.jberclaz.turbostage \
            --add-data "turbostage/content:turbostage/content" \
            --add-data "turbostage/conf:turbostage/conf" \
            -n turbostage turbostage/main.py

      - name: Check app architecture
        run: |
          file dist/turbostage.app/Contents/MacOS/turbostage
          file dist/turbostage.app/Contents/MacOS/turbostage | grep -q "${{ matrix.arch }}"

      - name: Create DMG
        run: |
          brew install create-dmg
          rm -f "dist/${{ matrix.dmg }}"
          create-dmg --volname "TurboStage" \
                     --background "splash.png" \
                     --app-drop-link 300 200 \
                     "dist/${{ matrix.dmg }}" "dist/turbostage.app"

      - name: Upload Build Artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          # Not ref_name: branch names may contain "/", which artifact names reject.
          name: turbostage-macos-${{ matrix.arch }}-${{ github.sha }}
          path: dist/${{ matrix.dmg }}

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda
        with:
          files: dist/${{ matrix.dmg }}
